# Config file for Air
root = "."
tmp_dir = "tmp"

[build]
  # Command untuk build
  cmd = "go build -o ./tmp/main.exe ."
  
  # Binary file (WAJIB .exe di Windows)
  bin = "tmp/main.exe"
  
  # File extensions yang di-watch
  include_ext = ["go", "tpl", "tmpl", "html"]
  
  # Folder yang di-exclude
  exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
  
  # Exclude file test
  exclude_regex = ["_test\\.go"]
  
  # Delay sebelum rebuild (ms)
  delay = 1000
  
  # Stop binary lama kalau ada error build
  stop_on_error = true

[log]
  # Tampilkan timestamp
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Hapus tmp folder saat exit
  clean_on_exit = true

[screen]
  # Clear screen saat rebuild
  clear_on_rebuild = true

